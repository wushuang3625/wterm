<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee3ff"/>
      <stop offset="60%" stop-color="#e7f7ff"/>
      <stop offset="100%" stop-color="#fff6d9"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd17a"/>
      <stop offset="100%" stop-color="#5aa84f"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#f09020"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a5f"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="670" cy="110" r="52" fill="#ffd54f"/>
  <circle cx="670" cy="110" r="66" fill="#ffd54f" opacity="0.35"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="100" rx="55" ry="28"/>
    <ellipse cx="195" cy="90" rx="40" ry="24"/>
    <ellipse cx="110" cy="92" rx="35" ry="20"/>
    <ellipse cx="480" cy="150" rx="45" ry="22"/>
    <ellipse cx="515" cy="142" rx="32" ry="18"/>
  </g>

  <!-- Distant hills -->
  <path d="M0,430 Q120,370 260,420 T520,410 T800,430 L800,470 L0,470 Z" fill="#bfe6a8" opacity="0.8"/>
  <path d="M0,455 Q160,410 330,450 T650,445 T800,460 L800,500 L0,500 Z" fill="#a8dd90" opacity="0.9"/>

  <!-- Ground -->
  <rect x="0" y="470" width="800" height="130" fill="url(#ground)"/>

  <!-- Road -->
  <rect x="0" y="512" width="800" height="60" fill="#9e9e9e"/>
  <rect x="0" y="512" width="800" height="6" fill="#bdbdbd"/>
  <g stroke="#fff59d" stroke-width="6" stroke-dasharray="34 26">
    <line x1="0" y1="545" x2="800" y2="545"/>
  </g>

  <!-- Grass tufts -->
  <g stroke="#4e9a3f" stroke-width="3" stroke-linecap="round">
    <path d="M40,505 q4,-14 8,0" fill="none"/>
    <path d="M70,508 q4,-14 8,0" fill="none"/>
    <path d="M720,505 q4,-14 8,0" fill="none"/>
    <path d="M755,508 q4,-14 8,0" fill="none"/>
    <path d="M300,500 q4,-14 8,0" fill="none"/>
  </g>

  <!-- ===== Bicycle ===== -->
  <g>
    <!-- Wheels -->
    <g>
      <circle cx="290" cy="440" r="78" fill="none" stroke="#263238" stroke-width="10"/>
      <circle cx="290" cy="440" r="66" fill="none" stroke="#546e7a" stroke-width="3"/>
      <g stroke="#90a4ae" stroke-width="3">
        <line x1="290" y1="440" x2="290" y2="374"/>
        <line x1="290" y1="440" x2="290" y2="506"/>
        <line x1="290" y1="440" x2="224" y2="440"/>
        <line x1="290" y1="440" x2="356" y2="440"/>
        <line x1="290" y1="440" x2="243" y2="393"/>
        <line x1="290" y1="440" x2="337" y2="487"/>
        <line x1="290" y1="440" x2="337" y2="393"/>
        <line x1="290" y1="440" x2="243" y2="487"/>
      </g>
      <circle cx="290" cy="440" r="9" fill="#37474f"/>
    </g>
    <g>
      <circle cx="530" cy="440" r="78" fill="none" stroke="#263238" stroke-width="10"/>
      <circle cx="530" cy="440" r="66" fill="none" stroke="#546e7a" stroke-width="3"/>
      <g stroke="#90a4ae" stroke-width="3">
        <line x1="530" y1="440" x2="530" y2="374"/>
        <line x1="530" y1="440" x2="530" y2="506"/>
        <line x1="530" y1="440" x2="464" y2="440"/>
        <line x1="530" y1="440" x2="596" y2="440"/>
        <line x1="530" y1="440" x2="483" y2="393"/>
        <line x1="530" y1="440" x2="577" y2="487"/>
        <line x1="530" y1="440" x2="577" y2="393"/>
        <line x1="530" y1="440" x2="483" y2="487"/>
      </g>
      <circle cx="530" cy="440" r="9" fill="#37474f"/>
    </g>

    <!-- Frame -->
    <g fill="none" stroke="url(#frame)" stroke-width="11" stroke-linecap="round">
      <line x1="290" y1="440" x2="410" y2="350"/>
      <line x1="410" y1="350" x2="530" y2="440"/>
      <line x1="290" y1="440" x2="400" y2="440"/>
      <line x1="400" y1="440" x2="410" y2="350"/>
      <line x1="400" y1="440" x2="470" y2="330"/>
      <line x1="470" y1="330" x2="530" y2="440"/>
      <line x1="470" y1="330" x2="410" y2="350"/>
      <line x1="470" y1="330" x2="560" y2="300"/>
    </g>

    <!-- Seat post + seat -->
    <line x1="400" y1="440" x2="385" y2="320" stroke="#455a64" stroke-width="8" stroke-linecap="round"/>
    <path d="M355,315 q30,-16 62,-2 q-4,14 -22,14 q-28,2 -40,-12 z" fill="#37474f"/>

    <!-- Handlebars -->
    <path d="M560,300 q26,-8 34,14 q4,14 -10,20" fill="none" stroke="#37474f" stroke-width="9" stroke-linecap="round"/>
    <circle cx="586" cy="334" r="7" fill="#263238"/>

    <!-- Pedals / crank -->
    <circle cx="400" cy="440" r="16" fill="#455a64"/>
    <line x1="400" y1="440" x2="400" y2="486" stroke="#455a64" stroke-width="7" stroke-linecap="round"/>
    <rect x="378" y="484" width="44" height="10" rx="4" fill="#263238"/>
    <line x1="400" y1="440" x2="400" y2="394" stroke="#455a64" stroke-width="7" stroke-linecap="round"/>
    <rect x="378" y="384" width="44" height="10" rx="4" fill="#263238"/>

    <!-- Basket -->
    <g>
      <path d="M600,300 h56 l-8,44 h-44 z" fill="url(#bag)" stroke="#d97706" stroke-width="3"/>
      <path d="M598,300 q30,-30 60,0" fill="none" stroke="#d97706" stroke-width="4"/>
      <line x1="586" y1="334" x2="604" y2="304" stroke="#455a64" stroke-width="6" stroke-linecap="round"/>
      <!-- baguette in basket -->
      <path d="M612,296 l40,-30" stroke="#e0a24a" stroke-width="10" stroke-linecap="round"/>
      <path d="M612,296 l40,-30" stroke="#c98436" stroke-width="10" stroke-linecap="round" stroke-dasharray="6 14"/>
    </g>
  </g>

  <!-- ===== Pelican ===== -->
  <g>
    <!-- Back wing (flapping) -->
    <path d="M360,300 q-60,-70 -130,-58 q40,40 60,70 q30,30 70,26 z"
          fill="#f4f6f8" stroke="#cfd8dc" stroke-width="3"/>

    <!-- Body -->
    <ellipse cx="420" cy="330" rx="88" ry="62" fill="#fafbfc" stroke="#cfd8dc" stroke-width="3"/>

    <!-- Tail -->
    <path d="M336,320 q-40,6 -56,30 q26,4 48,-2 q16,-4 26,-14 z" fill="#eceff1" stroke="#cfd8dc" stroke-width="3"/>

    <!-- Leg to pedal -->
    <path d="M405,368 q-10,40 -5,70" fill="none" stroke="#f0a030" stroke-width="12" stroke-linecap="round"/>
    <path d="M370,390 q10,30 8,60" fill="none" stroke="#f0a030" stroke-width="12" stroke-linecap="round"/>
    <!-- Webbed feet on pedals -->
    <path d="M378,384 q-16,4 -18,14 q14,6 34,2 q6,-8 -2,-16 z" fill="#ff9f1c"/>
    <path d="M390,486 q-16,4 -18,14 q14,6 34,2 q6,-8 -2,-16 z" fill="#ff9f1c"/>

    <!-- Front wing reaching handlebar -->
    <path d="M470,320 q60,10 105,20 q14,4 12,14 q-16,10 -46,4 q-40,-8 -74,-24 z"
          fill="#f4f6f8" stroke="#cfd8dc" stroke-width="3"/>
    <!-- Wing tip / "hand" on grip -->
    <ellipse cx="586" cy="340" rx="16" ry="11" fill="#eceff1" stroke="#cfd8dc" stroke-width="3" transform="rotate(-10 586 340)"/>

    <!-- Neck -->
    <path d="M470,300 q30,-40 26,-90 q-4,-50 -34,-74" fill="none" stroke="#fafbfc" stroke-width="46" stroke-linecap="round"/>
    <path d="M470,300 q30,-40 26,-90 q-4,-50 -34,-74" fill="none" stroke="#cfd8dc" stroke-width="48" stroke-linecap="round" opacity="0.35" stroke-dasharray="1 100"/>

    <!-- Head -->
    <circle cx="452" cy="132" r="46" fill="#fafbfc" stroke="#cfd8dc" stroke-width="3"/>

    <!-- Eye -->
    <circle cx="468" cy="120" r="10" fill="#ffffff" stroke="#b0bec5" stroke-width="2"/>
    <circle cx="471" cy="121" r="5.5" fill="#263238"/>
    <circle cx="473" cy="119" r="2" fill="#ffffff"/>
    <path d="M456,106 q12,-8 24,-2" fill="none" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/>

    <!-- Beak + pouch -->
    <path d="M486,126 L606,150 L486,158 Z" fill="#ffb703" stroke="#e09b00" stroke-width="3" stroke-linejoin="round"/>
    <path d="M486,146 L600,152 L492,186 Q470,168 486,146 Z" fill="url(#bag)" stroke="#e09b00" stroke-width="3" stroke-linejoin="round"/>
    <line x1="486" y1="134" x2="604" y2="150" stroke="#e09b00" stroke-width="2.5"/>

    <!-- Cheek blush -->
    <ellipse cx="444" cy="150" rx="12" ry="7" fill="#ffccbc" opacity="0.8"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="120" y1="340" x2="210" y2="340"/>
    <line x1="90" y1="380" x2="170" y2="380"/>
    <line x1="140" y1="420" x2="205" y2="420"/>
  </g>

  <!-- Motion dust -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="215" cy="470" r="10"/>
    <circle cx="190" cy="485" r="7"/>
    <circle cx="165" cy="472" r="5"/>
  </g>
</svg>
