[package]
name = "wterm"
version = "0.1.5"
description = "wterm — 开源、轻量、设计驱动的 SSH 工作台"
edition = "2021"
rust-version = "1.89"

[lib]
name = "wterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wterm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa", "flate2"] }
anyhow = "1"
dirs = "5"
base64 = "0.22"
russh-sftp = "2"
tauri-plugin-dialog = { version = "2.7.3" }
tauri-plugin-notification = { version = "2" }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
window-vibrancy = { version = "0.6" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
